[project]
name = "document-qa-bot"
version = "1.0.0"
description = "Conversational RAG over a PDF, with page-level source citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0",
    "langchain-core>=1.0",
    "langchain-classic>=1.0",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-chroma>=1.0",
    "langchain-huggingface>=1.0",
    "sentence-transformers>=5.0",
    "pymupdf>=1.26",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["rag*"]
